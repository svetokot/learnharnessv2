[package]
name = "learnharness-desktop"
version = "0.6.1"
description = "LearnHarness desktop client (Tauri): connects to a LearnHarness server"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "learnharness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
wry = "=0.57.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
# Debug-only window snapshots (LH_DESKTOP_SNAPSHOT) for verification.
cairo-rs = { version = "=0.18.5", features = ["png"] }
gtk = "=0.18.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
