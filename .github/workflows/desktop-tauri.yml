name: Desktop client (Tauri)

# The Tauri client in desktop/ — a thin native shell that connects to a
# LearnHarness server (docs/desktop-client.md). Manual runs build unsigned
# installers as workflow artifacts; nothing is released.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            artifact: desktop/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,rpm
            artifact: |
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
              desktop/target/release/learnharness
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf
      - name: Tauri CLI
        run: cargo install tauri-cli --version =2.12.4 --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-desktop-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
